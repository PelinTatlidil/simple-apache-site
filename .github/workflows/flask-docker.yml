name: Build, Test and Deploy Flask Docker App

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: flask-weather-app

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      - name: Run Docker container test
        run: |
          docker run -d -p 5000:5000 --name flask-test $IMAGE_NAME
          sleep 5
          curl http://localhost:5000
          docker stop flask-test
          docker rm flask-test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag $IMAGE_NAME ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest

      - name: Deploy app
        run: |
          echo "Deploy step goes here"
          echo "Example: pull and run the Docker image on a cloud server"